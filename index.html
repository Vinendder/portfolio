<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Portfolio</title>
<meta name="description" content="Portfolio of a Robotics and Automation student: education, projects, skills and contact.">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<script>
/* Apply saved theme before paint so there is no flash */
try {
  var t = localStorage.getItem("theme");
  if (!t) t = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
  document.documentElement.dataset.theme = t;
} catch (e) { document.documentElement.dataset.theme = "light"; }
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body>
<canvas id="fx" aria-hidden="true"></canvas>

<nav id="nav">
  <span class="brand" id="brand"></span>
  <div class="links" id="links"></div>
  <button id="theme" aria-label="Switch between light and dark mode">
    <svg class="moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></svg>
    <svg class="sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
  </button>
</nav>

<header class="hero">
  <h1 id="title"></h1>
  <p id="tagline"></p>
  <a class="go" href="#more">Explore</a>
</header>

<main id="more">
  <h2 class="reveal" id="heading"></h2>
  <div class="reveal" id="sections"></div>
</main>

<section class="contact reveal" id="contact">
  <h2 id="contactTitle"></h2>
  <p id="contactText"></p>
  <div class="actions" id="actions"></div>
</section>

<footer id="footer"></footer>

<!-- content.js holds your words; script.js builds the page from it -->
<script src="content.js"></script>
<script src="script.js"></script>
</body>
</html>
